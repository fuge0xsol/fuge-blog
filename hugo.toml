baseURL                = "https://fuge-blog.pages.dev/"
locale                  = "zh-cn"
defaultContentLanguage = "zh-cn"
title                  = "fuge's blog"
hasCJKLanguage         = true
enableEmoji            = true
theme                  = "stack"

[pagination]
    pagerSize = 5

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[params]
    mainSections   = ["post"]
    rssFullContent = true

    [params.footer]
        since = 2026

    [params.sidebar]
        subtitle = "Web3 · 链上 · 随笔"
        avatar   = "img/avatar.png"

    [params.article]
        toc         = true
        readingTime = true

    [params.comments]
        enabled = false

    [params.colorScheme]
        toggle  = true
        default = "auto"

    [params.widgets]
        homepage = [
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

[[menu.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/fuge0xsol"
    [menu.social.params]
        icon = "brand-github"

[[menu.social]]
    identifier = "rss"
    name       = "RSS"
    url        = "/index.xml"
    [menu.social.params]
        icon = "rss"

[markup.highlight]
    style   = "monokai"
    lineNos = false
